<button
  #button
  [type]="type()"
  [disabled]="disabled()"
  [class]="'button'"
  (click)="onClick($event)">
  <div class="button-content">
    @if (icon() && !showSpinner()) {
      <div class="icon">
        <mat-icon aria-hidden="false" [fontIcon]="icon()"></mat-icon>
      </div>
    }
    @if (showSpinner()) {
      <yata-spinner
        size="small"
        color="primary"
        [variant]="button.classList.value | yataVariantClass"></yata-spinner>
    } @else {
      <ng-content></ng-content>
    }
    <span
      *ngFor="let ripple of ripples()"
      class="ripple"
      [@rippleAnimation]
      [style.left.px]="ripple.x"
      [style.top.px]="ripple.y"
      [style.width.px]="ripple.size"
      [style.height.px]="ripple.size">
    </span>
  </div>
</button>
