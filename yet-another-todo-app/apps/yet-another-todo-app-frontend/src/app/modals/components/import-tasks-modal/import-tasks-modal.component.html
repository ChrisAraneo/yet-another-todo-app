<div class="figure">
  <yata-image
    src="../../../../public/images/import-tasks.jpg"
    [width]="480"
    [height]="576"
    [alt]="'ImportTasksModal.imageAlt' | translate" />
</div>
<div class="form">
  <yata-modal-title>{{
    'ImportTasksModal.modalTitle' | translate
  }}</yata-modal-title>
  <form [formGroup]="form" (submit)="$event.preventDefault()">
    <div class="controls">
      <yata-page [@fadeInOut]>
        <yata-file-input
          formControlName="file"
          [label]="'ImportTasksModal.file' | translate"
          [selectFileLabel]="'ImportTasksModal.selectFile' | translate"
          [changeFileLabel]="'ImportTasksModal.changeFile' | translate" />
        <yata-password-input
          formControlName="password"
          [label]="'ImportTasksModal.password' | translate"
          [parentForm]="form" />
        <span *ngIf="unzipError" class="error-label">
          {{ 'ImportTasksModal.unzipError' | translate }}
        </span>
      </yata-page>
    </div>
    <yata-modal-action-buttons
      [form]="form"
      [submitButton]="{ label: 'ImportTasksModal.submit', click: submit }" />
  </form>
</div>
