<div class="figure">
  <yata-image
    src="../../../../public/images/empty.jpg"
    [width]="480"
    [height]="576"
    [alt]="'EmptyDialog.imageAlt' | translate" />
</div>
<div class="main">
  <div *ngIf="titleKey && hintKey" class="content">
    <yata-title>{{ data.titleKey | translate }}</yata-title>
    <yata-subtitle>{{ data.hintKey | translate }}</yata-subtitle>
  </div>
  <yata-modal-action-buttons
    [submitButton]="{ label: 'EmptyDialog.ok', click: close }" />
</div>
